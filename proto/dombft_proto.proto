syntax = "proto3";
package dombft.proto;


message PaddedRequestData {
    bytes req_data = 1;
    bytes padding = 2;
}

message ClientRequest {
    uint32 client_id = 1;
    uint32 client_seq = 2;

    uint64 send_time = 5;
    uint64 deadline = 6;
    bool is_write = 7;

    bytes req_data = 8;
}



message DOMRequest {
    uint64  deadline = 1;
    uint64  send_time = 2;
    uint32  proxy_id = 3;
    bool    late = 4;
    uint32  deadline_set_size = 5;

    uint32  client_id = 6; // repeat client_id here for convenience in breaking ties
    uint32  client_seq = 7; // repeat client_seq here for debugging
    bytes   client_req = 8; // Bytes of Client Request + Signature
}

message DOMBatchRequest {
    uint64  send_time = 1;
    uint32  proxy_id = 2;
    repeated DOMRequest requests = 3;
}

message MeasurementReply {
    uint32 receiver_id = 1;
    int32 owd = 2;
    uint64 send_time = 3;
}

message Reply {
    uint32 client_id = 1;
    uint32 client_seq = 2;

    uint32 round = 3;

    // Tentative global ordering
    uint32 seq = 5;
    uint32 replica_id = 6;
    bytes result = 9;
    bytes digest = 10;

    bool queued = 11;
}

message Cert {
    // A cert logically is a set of 2f + 1 replies
    
    // TODO to save space, we would only store 1 copy of each common field. Instead
    // we just repeat them here since it's easier
    // seq is also just for convenience
    uint32 seq = 1;
    uint32 round = 2;
    
    repeated Reply replies    = 4;
    repeated bytes signatures = 5;
}


message CertReply {
    uint32 replica_id = 1;
    uint32 client_id = 2;
    uint32 client_seq = 3;
    uint32 round = 4;
    uint32 seq = 5;
}

message Commit {
    uint32 replica_id = 1;
    uint32 round = 2;

    uint32 seq = 3;
    bytes log_digest = 4;

    optional bytes app_digest = 7;

    ClientRecord client_record = 8;
}


message RepairTimeout
{    
    uint32 replica_id = 1;
    uint32 round = 2;
    uint32 view = 3;
    uint32 seq = 4;
}

message RepairTimeoutProof {
    uint32 replica_id = 1;
    uint32 round = 2;
    uint32 view = 3;
    
    repeated RepairTimeout timeouts = 4;
    repeated bytes signatures = 5;
}

message RepairReplyProof {
    uint32 replica_id = 1;
    uint32 round = 2;
    uint32 view = 3;

    repeated Reply replies = 4;
    repeated bytes signatures = 5;
}


message LogEntry
{
    uint32 seq = 4;
    uint32 client_id = 5;
    uint32 client_seq = 6;

    bytes digest = 7;

    // TODO remove this and add mechanism for replicas to fetch missing entries after fallback (as part of snapshot request maybe)
    bytes request = 8;
}

message ClientSequence
{
    uint32 client_id = 1;
    uint32 last_seq = 2;

    repeated uint32 missed_seqs = 3;
}

// wraps records and digest
message ClientRecord
{
    bytes digest = 1;
    repeated ClientSequence sequences = 2;
}

message LogCheckpoint
{
    uint32 seq = 1;
    bytes log_digest = 2;

    optional bytes app_digest = 5;

    repeated Commit commits   = 6;
    repeated bytes commit_sigs = 7;

    repeated PBFTCommit repair_commits = 8;
    repeated bytes repair_commit_sigs = 9;

    ClientRecord client_record = 10;
}



message RepairLog {
    repeated LogEntry entries = 1;
    LogCheckpoint checkpoint = 2;
    optional Cert cert = 3;
}

message PreparedHistory {
    repeated PBFTPrepare prepares = 1;
    repeated bytes prepare_sigs = 2; 
}

message RepairStart
{
    uint32 pbft_view = 1;
    uint32 round = 2;
    uint32 replica_id = 3;

    RepairLog log = 4;


    // If this is present, functions as a view change
    optional PreparedHistory prepared_history = 5;
}

message RepairProposal
{
    uint32 round = 1;
    uint32 view = 2;
    uint32 replica_id = 3; //primary id

    repeated RepairStart start_msgs = 4;
    repeated bytes signatures = 5;
}


message CommittedReply
{
    uint32 replica_id = 1;
    uint32 client_id = 2;
    uint32 client_seq = 3;
    uint32 seq = 4;
    bytes result = 5;

    bool is_repair = 6;
}

message RepairSummary
{
    uint32 round = 1;
    uint32 replica_id = 2;
    repeated CommittedReply replies = 3;
    uint32 pbft_view = 4;

    ClientSequence committed_seqs = 5;
}

message PBFTPrePrepare
{
    uint32 round = 1;
    uint32 primary_id = 2;
    uint32 pbft_view = 3;

    RepairProposal proposal = 4;
    bytes proposal_digest = 5;
}

message PBFTPrepare
{
    uint32 round = 1;
    uint32 replica_id = 2;
    uint32 pbft_view = 3;
    bytes proposal_digest = 4;
    bytes log_digest = 5;
}

message PBFTCommit
{
    uint32 round = 1;
    uint32 replica_id = 2;
    uint32 pbft_view = 3;
    bytes proposal_digest = 4;
    
    bytes log_digest = 5;
}

message ViewUpdate {
    uint32 round = 1;
    uint32 replica_id = 2;
    uint32 view = 3;
}


message SnapshotRequest {
    uint32 round = 1;
    uint32 seq = 2;
    uint32 replica_id = 3;
    uint32 last_checkpoint_seq = 4;

    bool for_repair = 5;
}

message SnapshotReply {
    uint32 round = 1;
    uint32 seq = 2;
    uint32 replica_id = 3;

    LogCheckpoint checkpoint = 4;
    repeated LogEntry log_entries = 5; 

    optional LogCheckpoint snapshot_checkpoint = 7;
    optional bytes snapshot = 8;
}


message DummyProtocolMessage
{

    uint32 phase = 1;
    uint32 replica_id = 2;
    uint32 seq = 3;

    message DummyClientRequest {
        uint32 client_id = 4;
        uint32 client_seq = 5;
        optional ClientRequest req = 6;
        optional bytes sig = 7;
    }

    repeated DummyClientRequest client_reqs = 7;
}

message PSLeaderForward {
    uint32 seq = 1;                        // Sequence number assigned by leader
    ClientRequest request = 2;
    bytes client_signature = 3;             // Client signature from original PS_CLIENT
}

message PSLeaderOrder {
    uint32 client_id = 1;
    uint32 client_seq = 2;
    uint32 seq = 3;           // Global sequence number assigned by serializer
}

