syntax = "proto3";
package flutter.proto;

// Flutter protocol messages based on Algorithm 1 from the paper

// Time message - servers announce their local time to other servers
message FlutterTime {
    uint64 local_time = 1;          // Current local time of the sending server
}

// Observe message - servers relay observed client messages to other servers
message FlutterObserve {
    uint32 client_id = 1;           // Client that sent the original message
    bytes message = 2;              // The original client message content
    uint64 bet = 3;                 // The bet (timestamp) attached by the client
}

// RBC Proposal message - servers propose client_id + bet pairs for consensus
message FlutterRBCProposal {
    uint32 client_id = 1;           // Client ID being proposed
    uint64 bet = 2;                 // Bet (timestamp) being proposed
    bool accept = 3;                // 0/1 whether to accept this proposal
}

// Container for all Flutter server-to-server messages
message FlutterMessage {
    uint32 sender_id = 1;           // ID of the sending server

    oneof payload {
        FlutterTime time = 2;
        FlutterObserve observe = 3;
        FlutterRBCProposal rbc_proposal = 4;
    }
}