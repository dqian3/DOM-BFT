syntax = "proto3";
package flutter.proto;

// Flutter protocol messages based on Algorithm 1 from the paper

// Flutter Client Request - simplified client request for Flutter protocol
message FlutterClientRequest {
    uint32 client_id = 1;               // Client that sent the request
    uint32 client_seq = 2;              // Client sequence number
    uint64 bet = 3;                // Client's deadline (bet)
    bytes req_data = 4;                 // Request payload data
}

// Flutter Reply - response from replica to client indicating accept/reject
message FlutterReply {
    uint32 replica_id = 1;          // ID of the replying replica
    uint32 client_id = 2;           // Client ID
    uint32 client_seq = 3;          // Client sequence number
    uint64 bet = 4;                 // The bet (timestamp) that was processed
    bool accepted = 5;              // Whether the request was accepted or rejected
    bytes result = 6;               // Result data (if accepted)
}


// Time message - servers announce their local time to other servers
message FlutterTime {
    uint64 local_time = 1;          // Current local time of the sending server
}

// Observe message - servers relay observed client messages to other servers
message FlutterObserve {
    uint32 client_id = 1;           // Client that sent the original message
    bytes message = 2;              // The original client message content
    uint64 bet = 3;                 // The bet (timestamp) attached by the client
}

// RBC Proposal message - servers propose client_id + bet pairs for consensus
message FlutterRBCProposal {
    uint32 client_id = 1;           // Client ID being proposed
    uint64 bet = 2;                 // Bet (timestamp) being proposed
    bool accept = 3;                // 0/1 whether to accept this proposal
}

// RBC Slow Proposal message - sent to leader when superquorum votes reached
message FlutterRBCSlowProposal {
    uint32 client_id = 1;           // Client ID
    uint64 bet = 2;                 // Bet (timestamp)
    bool accept = 3;                // Majority vote (accept/reject)
}

// RBC Slow Value message - leader's response to slow proposals
message FlutterRBCSlowValue {
    uint32 client_id = 1;           // Client ID
    uint64 bet = 2;                 // Bet (timestamp)
    bool accept = 3;                // Leader's decision based on f+1 threshold
}


// Container for all Flutter server-to-server messages
message FlutterMessage {
    uint32 sender_id = 1;           // ID of the sending server

    oneof payload {
        FlutterTime time = 2;
        FlutterObserve observe = 3;
        FlutterRBCProposal rbc_proposal = 4;
        FlutterRBCSlowProposal rbc_slow_proposal = 5;
        FlutterRBCSlowValue rbc_slow_value = 6;
    }
}