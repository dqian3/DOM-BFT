transport: simple-rpc 
resiliency: 3f+1
app: kv_store 

client:
  ips: 
  - "127.0.1.0"
  - "127.0.1.1"
  port: 33000
  keysDir: keys/client
  normalPathTimeout: 15000    # 15ms
  slowPathTimeout:   200000   # 200 ms
  requestTimeout: 10000000    # 10 s

  sendMode: "sendRate"
  maxInFlight: 10
  sendRate: 100
  runtimeSeconds: 600
  requestSize: 512
  useHMAC: false


# Proxy Info
proxy:
  ips: 
    - "127.0.0.9"  
    - "127.0.0.10"  
  shards: 1
  forwardPort: 31000
  measurementPort: 32000
  keysDir: keys/proxy
  maxOwd: 15000

# Replica Info
replica:
  ips: 
  - "127.0.0.1"
  - "127.0.0.2"
  - "127.0.0.3"
  - "127.0.0.4"
  port: 34000
  app: "counter"
  keysDir: "keys/replica"
  repairViewTimeout: 5000000
  repairTimeout: 1000000
  numVerifyThreads: 1
  numSendThreads: 2
  checkpointInterval: 100
  snapshotInterval: 500



