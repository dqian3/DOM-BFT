app: counter
transport: simple-rpc

# Flutter requires 5f+1 replicas
resiliency:
  f: 1
  e: 1

# Client Info
client:
  ips:
  - 10.138.0.12
  - 10.142.0.6
  - 10.150.0.4
  - 10.182.0.6
  port: 33000
  keysDir: keys/client

  sendMode: "sendRate"
  maxInFlight: 500
  sendRate: 800
  runtimeSeconds: 120
  requestSize: 512

  # Flutter-specific client settings
  initialBet: 1000000      # 1ms in microseconds
  betIncrement: 1000000    # Increase bet by 1ms on rejection
  requestTimeout: 10000000 # 10s timeout

# Replica Info - Flutter requires 5f+1 = 6 replicas for f=1
replica:
  ips:
  - 10.138.0.6
  - 10.138.0.7
  - 10.142.0.3
  - 10.150.0.3
  - 10.182.0.4
  - 10.182.0.5
  port: 34000
  keysDir: "keys/replica"
  numVerifyThreads: 6
  numSendThreads: 6

  # Flutter-specific settings
  clockBroadcastInterval: 100000  # Broadcast clock every 100ms

# Empty proxy config (Flutter doesn't use proxies)
proxy:
  ips: []
  forwardPort: 0
  keysDir: ""
