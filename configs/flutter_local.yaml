app: counter
transport: nng

# Pass checks for 5f + 1
resiliency:
  f: 1
  e: 1

# Client Info
client:
  ips:
  - "127.0.0.0"
  - "127.0.0.1"
  port: 33000
  keysDir: keys/client

  sendMode: "sendRate"
  maxInFlight: 10
  sendRate: 50
  runtimeSeconds: 60
  requestSize: 512

  # Flutter-specific client settings
  initialBet: 1000000  # 1ms in microseconds
  betIncrement: 1000000  # Increase bet by 1ms on rejection
  requestTimeout: 10000000  # 10s timeout

# Replica Info - Flutter requires 5f+1 replicas
replica:
  ips:
  - "127.0.2.0"
  - "127.0.2.1"
  - "127.0.2.2"
  - "127.0.2.3"
  - "127.0.2.4"
  - "127.0.2.5"
  port: 34000
  keysDir: "keys/replica"
  numVerifyThreads: 2
  numSendThreads: 2

  # Flutter-specific settings
  clockBroadcastInterval: 100000  # Broadcast clock every 100ms


# EMpty proxy config, not used
proxy:
  ips: []
  forwardPort: 0
  keysDir: ""