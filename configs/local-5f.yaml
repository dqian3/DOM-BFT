transport: nng 
app: kv_store 
resiliency: 5f+1

client:
  ips: 
  - "127.0.1.0"
  - "127.0.1.1"
  port: 33000
  keysDir: scripts/keys/client
  normalPathTimeout: 15000    # 15ms
  slowPathTimeout:   200000   # 200 ms
  requestTimeout: 10000000    # 10 s

  sendMode: "sendRate"
  maxInFlight: 10
  sendRate: 100
  runtimeSeconds: 300
  requestSize: 512


# Proxy Info
proxy:
  ips: 
    - "127.0.0.9"  
    - "127.0.0.10"  
  shards: 1
  forwardPort: 31000
  measurementPort: 32000
  keysDir: scripts/keys/proxy
  maxOwd: 15000

# Replica Info
replica:
  ips: 
  - "127.0.0.1"
  - "127.0.0.2"
  - "127.0.0.3"
  - "127.0.0.4"
  - "127.0.0.5"
  - "127.0.0.6"
  port: 34000
  app: "counter"
  keysDir: "scripts/keys/replica"
  repairViewTimeout: 5000000
  repairTimeout: 1000000
  numVerifyThreads: 1
  numSendThreads: 2
  checkpointInterval: 100
  snapshotInterval: 500



